[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pyamm"
version = "0.1.0"
description = "Pure Python Automated Market Maker engine"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Uthman Washington Oyekunle"}]
keywords = ["amm", "defi", "uniswap", "liquidity", "blockchain"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
    "Topic :: Office/Business :: Financial",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
pyamm = "pyamm.cli:main"
